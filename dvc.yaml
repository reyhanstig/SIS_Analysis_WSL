stages:
  step1_data_processing_cleaning:
    cmd: python -m step1_data_processing_cleaning
    deps:
      - step1_data_processing_cleaning/

  step3_decorrelation_scale_analysis:
    cmd: python -m step3_decorrelation_scale_analysis
    deps:
      - step3_decorrelation_scale_analysis/
      - step1_data_processing_cleaning/

  step2_hypoxia_frequency_calculation:
    cmd: python -m step2_hypoxia_frequency_calculation
    deps:
      - step2_hypoxia_frequency_calculation/
      - step1_data_processing_cleaning/

  step4_PCA_analysis:
    cmd: python -m step4_PCA_analysis
    deps:
      - step4_PCA_analysis/
      - step1_data_processing_cleaning/
      - step3_decorrelation_scale_analysis/

  step5_environmental_factor_correlation_analysis:
    cmd: python -m step5_environmental_factor_correlation_analysis
    deps:
      - step5_environmental_factor_correlation_analysis/
      - step4_PCA_analysis/

  step6_pick_up_area_location:
    cmd: python -m step6_pick_up_area_location
    deps:
      - step6_pick_up_area_location/
      - step4_PCA_analysis/
