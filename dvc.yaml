stages:
  step1_data_processing_cleaning:
    cmd: python -m step1_data_processing_cleaning
    deps:
      - step1_data_processing_cleaning/

  step2_decorrelation_scale_analysis:
    cmd: python -m step2_decorrelation_scale_analysis
    deps:
      - step2_decorrelation_scale_analysis/
      - step1_data_processing_cleaning/

  step2_hypoxia_frequency_calculation:
    cmd: python -m step2_hypoxia_frequency_calculation
    deps:
      - step2_hypoxia_frequency_calculation/
      - step1_data_processing_cleaning/

  step3_PCA_analysis:
    cmd: python -m step3_PCA_analysis
    deps:
      - step3_PCA_analysis/
      - step2_hypoxia_frequency_calculation/

  step5_environmental_factor_correlation_analysis:
    cmd: python -m step5_environmental_factor_correlation_analysis
    deps:
      - step5_environmental_factor_correlation_analysis/
      - step3_PCA_analysis/
