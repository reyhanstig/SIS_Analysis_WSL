seasonal_subsets:
  parameters_to_process: ['do_', 'temp', 'wtemp', 'salt']
  min_periods: 15        # stations must have >= this many years of data to be included
  representative_months: # single month used per season (from sampling_months_check analysis)
    Spring: 5            # May
    Summer: 7            # July
    Autumn: 10           # October
    Winter: 1            # January

interpolation:
  weighting_func: gaussian
  min_weight: 0.01
  search_radius_factor: 2.0

decorrelation:
  min_periods: 15
  r_crit_alpha: 0.01
  distance_cutoff_km: 100

seasonal_plots:
  parameters: ['do_', 'temp', 'wtemp', 'salt']
  seasons: ['Spring', 'Summer', 'Autumn', 'Winter']
  layers: ['surface', 'bottom']
  years: [1991]
  plot_types:
    individual: true
    progressive: true
    grid_2x2: true

mapping:
  # Option A: To target the entire Seto Inland Sea
  target_region: "Seto Inland Sea" 
  region_column: "watermass_name" 

  # OR: To target a specific sub-bay (e.g., Osaka Bay, Tokyo Bay, Ise Bay)
  # target_region: "Osaka Bay"
  # region_column: "division"

  # Option B: Bounding box for Seto Inland Sea (based on your map coordinates)
  bbox:
    min_lon: 130.5
    max_lon: 135.5
    min_lat: 32.5
    max_lat: 35.0
