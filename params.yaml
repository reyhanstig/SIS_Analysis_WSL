seasonal_subsets:
  min_periods: 15        # stations must have >= this many years of data to be included
  representative_months: # single month used per season (from sampling_months_check analysis)
    Spring: 5            # May
    Summer: 7            # July
    Autumn: 10           # October
    Winter: 1            # January

interpolation:
  weighting_func: gaussian
  min_weight: 0.01
  search_radius_factor: 2.0

decorrelation:
  min_periods: 15
  r_crit_alpha: 0.01
  distance_cutoff_km: 100
